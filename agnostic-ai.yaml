# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.90.0/docs/schemas/config.schema.json
version: 1
requires: "0.90.0"
builtins: [memory]

lint:
  instructions-words: 1000
  codex-chain-bytes: 24576

targets:
  - claude
  - codex

# Set to error to fail sync when a target cannot represent a spec.
on-unsupported: warn

gitignore:
  enabled: true

models:
  fast: {claude: haiku, codex: luna, effort: low}
  balanced: {claude: sonnet, codex: sol, effort: medium}
  strong: {claude: opus, codex: sol, effort: high}
