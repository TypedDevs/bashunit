name: Agent Specs

on:
  pull_request:
    paths:
      - '.agnostic-ai/**'
      - 'agnostic-ai.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.gitignore'
      - '.worktreeinclude'
      - '.github/workflows/check-agent-specs.yml'
  push:
    branches: [main]
    paths:
      - '.agnostic-ai/**'
      - 'agnostic-ai.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.gitignore'
      - '.worktreeinclude'
      - '.github/workflows/check-agent-specs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install contributor dependencies
        run: |
          npm ci --ignore-scripts
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate and generate both targets
        run: |
          npm run agents:sync
          npm run agents:check
          git diff --exit-code
      - name: Verify native hook dispatch
        run: |
          python3 - <<'PYDISPATCH'
          import json
          import re
          from pathlib import Path

          configurations = (
              ("claude", ".claude/settings.json", ("Edit", "MultiEdit", "Write", "NotebookEdit")),
              ("codex", ".codex/hooks.json", ("apply_patch",)),
          )
          for target, filename, tools in configurations:
              hooks = json.loads(Path(filename).read_text())["hooks"]
              for event, script in (("PreToolUse", "protect-generated.sh"),
                                    ("PostToolUse", "shellcheck-after-edit.sh")):
                  for tool in tools:
                      assert any(
                          re.fullmatch(entry.get("matcher", ".*"), tool)
                          and any(script in handler.get("command", "") for handler in entry["hooks"])
                          for entry in hooks.get(event, [])
                      ), (target, event, tool, script)
          PYDISPATCH
      - name: Verify shared ShellCheck hook
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "edited shell.sh"
              path.write_text("#!/usr/bin/env bash\necho $1\n")
              result = subprocess.run(
                  [
                      "agnostic-ai", "hook", "run", "shellcheck-after-edit",
                      "--edit", str(path), "--format", "json",
                  ],
                  check=True, capture_output=True, text=True,
              )
              targets = json.loads(result.stdout)["targets"]
              assert {target["target"] for target in targets} == {"claude", "codex"}
              for target in targets:
                  assert target["counted"] and not target["warnings"], target
                  assert any("SC2086" in command["stdout"] for command in target["commands"]), target
          PY
      - name: Verify generated-output guard
        run: |
          python3 - <<'PYGUARD'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          def verify(arguments, expected, targets={"claude", "codex"}):
              result = subprocess.run(
                  ["agnostic-ai", "hook", "run", "protect-generated", *arguments,
                    "--expect", expected, "--format", "json"],
                  check=True, capture_output=True, text=True,
              )
              actual = json.loads(result.stdout)["targets"]
              assert {target["target"] for target in actual} == targets, actual
              for target in actual:
                  assert target["counted"] and not target["warnings"], target
                  assert target["decision"] == expected, target

          for path in ("AGENTS.md", "src/AGENTS.md", "CLAUDE.md",
                        ".claude/rules/runtime.md", ".codex/config.toml", ".CODEX/config.toml"):
              verify(["--edit", path], "block")
          for path in (".agnostic-ai/AGNOSTIC_AI.md", "src/assert/core.sh"):
              verify(["--edit", path], "allow")
          verify(["--bash", "npm run agents:sync"], "allow")

          patches = (
              "*** Delete File: AGENTS.md\n",
              "*** Update File: notes.md\n*** Move to: AGENTS.md\n@@\n-old\n+new\n",
              "*** Update File: AGENTS.md\n*** Move to: notes.md\n@@\n-old\n+new\n",
          )
          with tempfile.TemporaryDirectory() as directory:
              payload = Path(directory) / "event.json"
              for patch in patches:
                  payload.write_text(json.dumps({
                      "cwd": str(Path.cwd()), "tool_name": "apply_patch",
                      "tool_input": {"command": "*** Begin Patch\n" + patch + "*** End Patch\n"},
                  }))
                  verify(["--target", "codex", "--payload", str(payload)], "block", {"codex"})
          PYGUARD
