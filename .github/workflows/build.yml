name: Build Verification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-verify:
    name: "Build & Verify on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install standalone build optimizer
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1

      - name: Build and verify
        shell: bash
        run: |
          ./build.sh --verify
