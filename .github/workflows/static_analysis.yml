name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in arm64) arch=aarch64 ;; esac
          version=v0.11.0
          archive="shellcheck-${version}.${os}.${arch}.tar.xz"
          gh release download "$version" --repo koalaman/shellcheck \
            --pattern "$archive" --dir "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$version" >> "$GITHUB_PATH"

      - name: Run ShellCheck
        run: make sa
