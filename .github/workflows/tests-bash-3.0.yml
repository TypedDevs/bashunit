name: Bash 3.0 Compatibility

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'adrs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches:
      - main

concurrency:
  group: bash3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-image:
    name: "Build Bash 3.0 Image"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Bash 3.0 Docker image
        run: |
          # Docker Hub answers 502 often enough to have failed this job on an
          # unrelated PR (#1127); the curl retries inside the build (#1107) do
          # not help, because the base-image pull happens before them. Three
          # attempts, backing off, and the last one still fails the job.
          cat >/tmp/bash3.Dockerfile <<'EOF'
          FROM debian:bookworm-slim

          RUN apt-get update && apt-get install -y \
              build-essential \
              curl \
              ca-certificates \
              bison \
              git \
              procps \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /tmp
          # ftp.gnu.org times out often enough to have failed two unrelated PRs
          # in one afternoon (curl exit 28). Retry, and fall back to a GNU
          # mirror before giving up, so a red tick means the code is red.
          RUN (curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused --connect-timeout 20 \
                    -o bash-3.0.tar.gz https://ftp.gnu.org/gnu/bash/bash-3.0.tar.gz \
                || curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused --connect-timeout 20 \
                    -o bash-3.0.tar.gz https://mirrors.kernel.org/gnu/bash/bash-3.0.tar.gz) \
              && tar xzf bash-3.0.tar.gz \
              && cd bash-3.0 \
              && curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused --connect-timeout 20 \
                    -o support/config.guess 'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess' \
              && curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused --connect-timeout 20 \
                    -o support/config.sub 'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub' \
              && chmod +x support/config.guess support/config.sub \
              && ./configure --prefix=/opt/bash-3.0 \
              && make \
              && make install \
              && rm -rf /tmp/bash-3.0*

          WORKDIR /bashunit
          CMD ["/opt/bash-3.0/bin/bash", "--version"]
          EOF

          for attempt in 1 2 3; do
            if docker build -t bashunit-bash3 -f /tmp/bash3.Dockerfile .; then
              exit 0
            fi
            echo "docker build failed (attempt $attempt/3)" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Save Docker image
        run: docker save bashunit-bash3 -o /tmp/bashunit-bash3.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bashunit-bash3-image
          path: /tmp/bashunit-bash3.tar
          retention-days: 1

  test:
    name: "Bash 3.0 - ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Sequential"
            flags: ""
          - name: "Parallel"
            flags: "--parallel"
          - name: "Simple"
            flags: "--simple"
          - name: "Simple Parallel"
            flags: "--simple --parallel"
          - name: "Strict"
            flags: "--simple --parallel --strict"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Config
        run: cp .env.example .env

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: bashunit-bash3-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/bashunit-bash3.tar

      - name: Verify Bash 3.0 version
        run: docker run --rm bashunit-bash3 /opt/bash-3.0/bin/bash --version

      - name: Run tests with Bash 3.0 (${{ matrix.name }})
        run: |
          docker run --rm \
            -v "$(pwd)":/bashunit \
            -w /bashunit \
            bashunit-bash3 \
            /opt/bash-3.0/bin/bash ./bashunit ${{ matrix.flags }} tests/
